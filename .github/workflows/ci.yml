name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `lint` is deliberately not part of this gate yet: `pnpm lint` fails today on
# 74 pre-existing warnings across the repo (unrelated to any change this
# workflow was introduced with). See HEARTBEAT.md's lint-debt ticket — add a
# `Lint` step here once that's cleaned up, so the gate doesn't ship red on day one.
jobs:
  checks:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test
