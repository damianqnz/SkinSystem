name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    env:
      # next.config.js throws without it, and Next 16.3 evaluates the config during
      # `next typegen`. Only the hostname is read (image remote patterns), so a
      # placeholder is enough for type-check, lint and test.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
